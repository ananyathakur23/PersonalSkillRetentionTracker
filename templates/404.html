{% extends 'accounts/base.html' %}

{% block content %}

<div class="text-center mt-5 py-5" style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
    <div class="container">
        <div class="card shadow-lg border-0 p-5" style="background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); max-width: 500px; margin: 0 auto;">
            <h1 class="display-1 fw-bold mb-3" style="background: linear-gradient(135deg, #facc15, #fde047); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 6rem;">
                404
            </h1>
            
            <h3 class="mt-3" style="color: #e2e8f0;">
                Page Not Found
            </h3>

            <p class="mt-3" style="color: #94a3b8;">
                Oops... the page you're looking for doesn't exist.
            </p>

            <a href="{% url 'home' %}" class="btn btn-primary mt-3">
                <i class="bi bi-house-door"></i> Go Home
            </a>
        </div>
    </div>
</div>

{% endblock %}
