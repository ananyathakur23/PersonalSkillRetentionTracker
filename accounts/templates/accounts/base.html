<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PSRT - Personal Skill Retention Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* EMERGENCY TABLE FIX - FORCES VISIBILITY */
      .table thead th {
          color: #facc15 !important;
          background: rgba(59, 130, 246, 0.2) !important;
          border-bottom: 2px solid #facc15 !important;
      }
      .table tbody td {
          color: #e2e8f0 !important;
          background: rgba(15, 23, 42, 0.6) !important;
      }
      .table tbody td small {
          color: #94a3b8 !important;
      }
      body {
          color: #e2e8f0 !important;
      }
      .card-body {
          color: #e2e8f0 !important;
      }
      h3, h4, h5, h6 {
          color: #e2e8f0 !important;
      }
      .text-muted {
          color: #94a3b8 !important;
      }
  </style>
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold gold-text" href="{% url 'home' %}">PSRT</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'skills_list' %}">Skills</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'practice_history' %}">Practice History</a>
        </li>
      </ul>

      <ul class="navbar-nav">
        {% if user.is_authenticated %}
        <li class="nav-item d-flex align-items-center">
          <span class="nav-link mb-0">Hello {{ user.username }}</span>
        </li>

        <li class="nav-item d-flex align-items-center">
          <form method="POST" action="{% url 'logout' %}" class="d-inline m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-light ms-2">
              Logout
            </button>
          </form>
        </li>

        {% else %}

        <li class="nav-item">
          <a class="nav-link" href="{% url 'login' %}">Login</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'register' %}">Register</a>
        </li>
        
        {% endif %}
      </ul>

    </div>
  </div>
</nav>

<div class="container-lg mt-4">
    {% block content %}
    {% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  const bars = document.querySelectorAll('.progress-bar-width');
  bars.forEach(function(bar) {
    let width = bar.getAttribute('data-width');
    bar.style.width = width + '%';
  });
});
</script>
</body>
</html>
