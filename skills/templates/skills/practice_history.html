{% extends 'accounts/base.html' %}

{% block content %}

<h2 class="mb-4">
    <i class="bi bi-clock-history"></i> Practice History
</h2>

<div class="card shadow-lg border-0">
    <div class="card-body">
        <table class="table table-hover align-middle">
            <thead>
                <tr>
                    <th>Skills</th>
                    <th>Date</th>
                    <th>Quality</th>
                    <th>Notes</th>
                </tr>
            </thead>

            <tbody>
                {% for log in logs %}
                <tr>
                    <td>{{ log.skill.name }}</td>
                    <td>{{ log.date }}</td>

                    <td>
                        <span class="badge bg-primary">
                            {{ log.get_quality_display }}
                        </span>
                    </td>

                    <td>
                        {{ log.notes|default:"-" }}
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center py-4">
                        No practice logs yet!
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
