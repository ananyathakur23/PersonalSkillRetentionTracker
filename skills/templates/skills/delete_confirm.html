{% extends 'accounts/base.html' %}

{% block content %}

<div class="text-center">
    <h3>Are you sure you wish to delete this skill?</h3>
    <p>{{ skill.name }}</p>

    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Yes, Delete!</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
