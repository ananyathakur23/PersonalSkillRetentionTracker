{% extends 'accounts/base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Add Practice for "{{ skill.name }}"</h3>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label>Date</label>{{ form.date }}
                        <small class="form-text text-muted">You cannot select a future date.</small>
                    </div>

                    <div class="mb-3">
                        <label>Practice Quality</label>{{ form.quality }}
                    </div>

                    <div class="mb-3">
                        <label>Notes</label>{{ form.notes }}
                    </div>

                    <button type="submit" class="btn btn-success w-100">Save Practice</button>
                </form>

                <a href="{% url 'dashboard' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
